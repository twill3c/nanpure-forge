<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nanpure-forge — ナンプレ工房</title>
  <meta name="description" content="Rust + WebAssembly のナンプレ。全問題が一意解であることを機械検証してから出題する">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E9%EF%B8%8F%E2%83%A3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>nanpure-forge</h1>
      <p class="subtitle">Rust + WebAssembly のナンプレ工房 — 出題は全問一意解を検証済み</p>
    </header>

    <div class="layout">
      <section class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="ナンプレの盤面"></div>
        <div id="banner" class="banner" hidden>🎉 完成! <span id="banner-time"></span></div>
        <div class="pad" id="pad" role="group" aria-label="数字入力"></div>
      </section>

      <aside class="panel">
        <div class="row" role="group" aria-label="新しい問題">
          <span class="label">新しい問題</span>
          <button type="button" data-diff="0">やさしい</button>
          <button type="button" data-diff="1">ふつう</button>
          <button type="button" data-diff="2">むずかしい</button>
        </div>

        <div class="row">
          <button type="button" id="check">答え合わせ</button>
          <button type="button" id="hint">ヒント</button>
          <button type="button" id="clear">全消し</button>
        </div>

        <dl class="stats">
          <div><dt>タイム</dt><dd id="time">0:00</dd></div>
          <div><dt>難易度</dt><dd id="diff-label">ふつう</dd></div>
          <div><dt>ヒント数</dt><dd id="givens">—</dd></div>
          <div><dt>問題番号</dt><dd id="seed">—</dd></div>
        </dl>

        <p class="hint-text">
          マスをタップ → 下の数字で入力。赤くなったら行・列・箱のどこかで重複。
          この検査も Rust(WASM)がやっている — JS はナンプレの規則を知らない。
        </p>
      </aside>
    </div>

    <footer class="footer" id="footer"></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
